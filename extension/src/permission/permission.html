<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Microphone Permission — Murmur</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fbfbfa;
      color: #1b1a18;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      border: 1px solid #eae9e5;
      border-radius: 16px;
      padding: 32px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 12px 28px -4px rgba(27, 26, 24, 0.08);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-size: 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #65635c;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #1d4ed8;
    }
    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #15803d;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎙️</div>
    <h1>Enable Voice for Murmur</h1>
    <p>Murmur uses your microphone to transcribe voice tasks instantly. Tap below to grant permission once for the extension.</p>
    <button id="grant-btn">Allow Microphone Access</button>
    <div id="status" class="status">✓ Microphone enabled! Closing tab...</div>
  </div>

  <script type="module" src="./permission.js"></script>
</body>
</html>
